name: Generate Profile Art

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - profile.json
      - .github/workflows/profile-art.yml

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the contribution skyline and the terminal card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/skyline.py --user "${{ github.repository_owner }}" --out dist/skyline.svg
          python scripts/neofetch.py --user "${{ github.repository_owner }}" --out dist/neofetch.svg

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
